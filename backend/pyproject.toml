[project]
name = "crucible"
version = "0.1.0"
description = "An eval-driven coding-agent harness"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi",
    "litellm==1.102.0",
    "sqlalchemy>=2.0.54",
    "uuid6>=2025.0.1",
    "uvicorn[standard]",
]

[project.scripts]
crucible = "crucible.evals.cli:main"

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "docker: requires a reachable Docker daemon and configured test image",
    "real_model: requires explicit opt-in and configured model credentials",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/crucible"]
